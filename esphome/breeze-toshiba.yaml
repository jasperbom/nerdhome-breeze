# Nerdhome Breeze voor Toshiba - shared ESPHome package (board: toshiba-c6 rev 1.0)
# Toshiba RAS indoor units (Shorai, Seiya, Haori, ...) via the CN22 wifi port.
#
# Board: ESP32-C6-MINI-1U-H4, UART to the indoor unit on GPIO19 (TX) / GPIO20 (RX), 9600 8E1.
# This file holds everything that is the same for every indoor unit. Each unit gets a small
# local YAML that pulls this file from GitHub (see toshiba-woonkamer.yaml) and only adds its
# name, API key and wifi credentials. Change something here, push it, and every unit picks it
# up on its next build/install.
#
# No secrets in this file (remote packages cannot use !secret).

substitutions:
  name: breeze-toshiba
  friendly_name: Nerdhome Breeze
  project_version: "1.0.0"
  log_level: INFO

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: nerdhome.breeze-toshiba
    version: ${project_version}

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

# Logs go over the native USB port (bench only); the hardware UART is used for the AC.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: ${log_level}

api:

wifi:
  ap:
    ssid: ${name}

captive_portal:

external_components:
  # Nerdhome-versie van pedobry/esphome_toshiba_suzumi, met plasmafilter.
  # Zie esphome/components/toshiba_suzumi/NERDHOME.md voor herkomst en wijzigingen.
  - source:
      type: git
      url: https://github.com/jasperbom/nerdhome-breeze
      ref: main
      path: esphome/components
    components: [toshiba_suzumi]

uart:
  id: uart_bus
  tx_pin: GPIO19
  rx_pin: GPIO20
  baud_rate: 9600
  parity: EVEN

climate:
  - platform: toshiba_suzumi
    name: None              # entity gets the friendly_name of the device
    id: airco
    uart_id: uart_bus
    update_interval: 60s    # kamertemperatuur elke minuut opvragen (component-standaard: 120 s)
    indoor_temp:
      # De unit meldt de kamertemperatuur in hele graden. Een glijdend gemiddelde over
      # 10 minuten haalt het heen-en-weer springen rond een halve graad weg en geeft
      # daar een tussenwaarde (bijv. 19,6). Staat de temperatuur stil, dan blijft het
      # een heel getal. Het climate-entity zelf blijft de ruwe waarde tonen.
      name: Ruimtetemperatuur
      id: ruimtetemperatuur
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 10
            send_every: 1
    outdoor_temp:
      name: Buitentemperatuur
    power_select:
      name: Vermogensniveau
    # Lamellen en plasmafilter staan standaard aan. Een unit zonder vaste lamelstanden,
    # horizontale lamellen of plasmafilter negeert die commando's; het plasmafilter blijft
    # dan op "Onbekend" omdat de unit nooit een stand terugmeldt.
    vertical_air_direction:
      name: Lamellen verticaal
      icon: mdi:arrow-up-down
    horizontal_swing: true
    plasma:
      name: Plasmafilter
    # Optional, enable after checking your unit supports them:
    # self_clean:
    #   name: Zelfreiniging
    # disable_wifi_led: true

status_led:
  pin: GPIO23

# --- Draaiuren en onderhoud -------------------------------------------------------
# Telt elke minuut dat de binnenunit aan staat (elke stand behalve uit). De tellers
# staan in flash en overleven een herstart; ze worden hooguit elke 10 minuten
# weggeschreven om slijtage te beperken (na stroomuitval mis je dus max. 10 minuten).
preferences:
  flash_write_interval: 10min

globals:
  - id: draaitijd_totaal_s
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: draaitijd_onderhoud_s
    type: uint32_t
    restore_value: true
    initial_value: "0"

interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(airco).mode != climate::CLIMATE_MODE_OFF) {
            id(draaitijd_totaal_s) += 60;
            id(draaitijd_onderhoud_s) += 60;
          }
      - component.update: draaiuren_totaal
      - component.update: draaiuren_onderhoud

number:
  - platform: template
    id: onderhoudsinterval
    name: Onderhoudsinterval
    icon: mdi:wrench-clock
    entity_category: config
    unit_of_measurement: h
    min_value: 25
    max_value: 2000
    step: 25
    initial_value: 250
    optimistic: true
    restore_value: true

binary_sensor:
  - platform: template
    name: Onderhoud nodig
    device_class: problem
    lambda: |-
      return id(draaitijd_onderhoud_s) / 3600.0f >= id(onderhoudsinterval).state;

sensor:
  - platform: wifi_signal
    name: WiFi signaal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: template
    id: draaiuren_totaal
    name: Draaiuren
    icon: mdi:timer-cog-outline
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(draaitijd_totaal_s) / 3600.0f;
  - platform: template
    id: draaiuren_onderhoud
    name: Draaiuren sinds onderhoud
    icon: mdi:air-filter
    unit_of_measurement: h
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(draaitijd_onderhoud_s) / 3600.0f;

button:
  - platform: restart
    name: Herstart
    entity_category: config
  - platform: template
    name: Onderhoud uitgevoerd
    icon: mdi:wrench-check
    entity_category: config
    on_press:
      - lambda: |-
          id(draaitijd_onderhoud_s) = 0;
      - component.update: draaiuren_onderhoud
